<!DOCTYPE html>
<html>
<head>
    <title>Pantry Matcher</title>
</head>
<body>
    <h1>What can I cook?</h1>
    
    <input type="text" id="ingredientInput" placeholder="e.g. curd, capsicum, atta, onion">
    <button id="findButton">Find Recipes</button>
    
    <div id="results"></div>

    <script>
        document.getElementById("findButton").addEventListener("click", async () => {
            const inputText = document.getElementById("ingredientInput").value;
            const ingredients = inputText.split(",").map(item => item.trim());

            const response = await fetch("http://127.0.0.1:8000/recipes", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ingredients: ingredients })
            });

            const data = await response.json();
            displayResults(data.recipes);
        });

        function displayResults(recipes) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            recipes.forEach(recipe => {
                const recipeBlock = document.createElement("div");
                recipeBlock.innerHTML = `
                    <h3>${recipe.title}</h3>
                    <p>Coverage: ${recipe.coverage_score} | Semantic: ${recipe.semantic_score}</p>
                    <p>Missing: ${recipe.missed.join(", ")}</p>
                    <button onclick="showRecipeDetails(${recipe.id})">View Recipe</button>
                    <div id="details-${recipe.id}"></div>
                `;
                resultsDiv.appendChild(recipeBlock);
            });
        }

        async function showRecipeDetails(recipeId) {
            const detailsDiv = document.getElementById(`details-${recipeId}`);
            detailsDiv.innerHTML = "Loading...";

            const response = await fetch(`http://127.0.0.1:8000/recipes/${recipeId}`);
            const data = await response.json();

            detailsDiv.innerHTML = `
                <p><strong>Ready in:</strong> ${data.readyInMinutes} minutes | <strong>Servings:</strong> ${data.servings}</p>
                <p style="white-space: pre-line">${data.instructions}</p>
            `;
        }
    </script>
</body>
</html>
